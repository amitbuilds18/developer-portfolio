<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity="0.4" />
    </pattern>

    <!-- Radial Ambient Blur -->
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="url(#bgGradient)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="1200" cy="120" r="220" fill="#6366f1" fill-opacity="0.18" filter="url(#glowBlur)" />
  <circle cx="1450" cy="280" r="180" fill="#06b6d4" fill-opacity="0.15" filter="url(#glowBlur)" />
  <circle cx="750" cy="350" r="160" fill="#a855f7" fill-opacity="0.12" filter="url(#glowBlur)" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <rect width="1584" height="396" fill="url(#techGrid)" />

  <!-- Diagonal Accent Lines / Circuit Paths -->
  <g stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <path d="M 900 0 L 1050 150 L 1584 150" />
    <path d="M 1150 0 L 1280 130 L 1584 130" stroke="#818cf8" stroke-dasharray="6,6" />
    <path d="M 780 396 L 920 256 L 1584 256" stroke="#06b6d4" />
    <circle cx="1050" cy="150" r="4" fill="#6366f1" />
    <circle cx="920" cy="256" r="4" fill="#06b6d4" />
  </g>

  <!-- Right Decorative Microservice Code Card -->
  <g transform="translate(1080, 50)">
    <!-- Glassmorphic Card Container -->
    <rect width="450" height="296" rx="16" fill="#0b1329" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
    
    <!-- Window Header -->
    <rect width="450" height="38" rx="16" fill="#0f172a" fill-opacity="0.9" />
    <rect y="26" width="450" height="12" fill="#0f172a" fill-opacity="0.9" />
    <line x1="0" y1="38" x2="450" y2="38" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Traffic Lights -->
    <circle cx="20" cy="19" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="52" cy="19" r="5" fill="#10b981" fill-opacity="0.8" />
    
    <!-- Tab Title -->
    <text x="75" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">system_architecture.ts</text>
    
    <!-- Code Lines -->
    <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" xml:space="preserve">
      <text x="24" y="70" fill="#818cf8"><tspan fill="#f43f5e">const</tspan> <tspan fill="#38bdf8">engineer</tspan> = {</text>
      <text x="44" y="94" fill="#94a3b8">name: <tspan fill="#34d399">"Amit Kumar Ray"</tspan>,</text>
      <text x="44" y="118" fill="#94a3b8">role: <tspan fill="#34d399">"Full Stack Developer"</tspan>,</text>
      <text x="44" y="142" fill="#94a3b8">specialties: [</text>
      <text x="64" y="166" fill="#fbcfe8"><tspan fill="#a78bfa">"ACID Transactions"</tspan>, <tspan fill="#a78bfa">"Node.js"</tspan>,</text>
      <text x="64" y="190" fill="#fbcfe8"><tspan fill="#a78bfa">"React 19"</tspan>, <tspan fill="#a78bfa">"PostgreSQL (Neon)"</tspan></text>
      <text x="44" y="214" fill="#94a3b8">],</text>
      <text x="44" y="238" fill="#94a3b8">status: <tspan fill="#10b981">"Ready to Join Immediately"</tspan></text>
      <text x="24" y="266" fill="#818cf8">};</text>
    </g>
  </g>

  <!-- Left/Center Hero Typography (Clear of Profile Photo Area: Starts at x = 420) -->
  <g transform="translate(420, 75)">
    <!-- Top Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="250" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#10b981" />
      <circle cx="16" cy="15" r="8" fill="#10b981" fill-opacity="0.25" />
      <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">AVAILABLE FOR HIRE • 2024</text>
    </g>

    <!-- Big Name -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGlow)" letter-spacing="-0.5">
      Amit Kumar Ray
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">
      Full Stack &amp; Cloud Microservices Engineer
    </text>

    <!-- Tagline -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Architecting high-concurrency fintech platforms, AI voice agents &amp; resilient cloud systems.
    </text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 172)">
      <!-- Badge 1: React 19 -->
      <g transform="translate(0, 0)">
        <rect width="84" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" fill-opacity="0.8" />
        <text x="42" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">React 19</text>
      </g>
      <!-- Badge 2: TypeScript -->
      <g transform="translate(92, 0)">
        <rect width="98" height="28" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="0.8" fill-opacity="0.8" />
        <text x="49" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#93c5fd">TypeScript</text>
      </g>
      <!-- Badge 3: Node.js -->
      <g transform="translate(198, 0)">
        <rect width="82" height="28" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="0.8" fill-opacity="0.8" />
        <text x="41" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4ade80">Node.js</text>
      </g>
      <!-- Badge 4: Express 5 -->
      <g transform="translate(288, 0)">
        <rect width="86" height="28" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="0.8" fill-opacity="0.8" />
        <text x="43" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#cbd5e1">Express 5</text>
      </g>
      <!-- Badge 5: PostgreSQL -->
      <g transform="translate(382, 0)">
        <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="0.8" fill-opacity="0.8" />
        <text x="67" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a5b4fc">PostgreSQL (Neon)</text>
      </g>
      <!-- Badge 6: Docker -->
      <g transform="translate(525, 0)">
        <rect width="76" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" fill-opacity="0.8" />
        <text x="38" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#67e8f9">Docker</text>
      </g>
    </g>

    <!-- Bottom Contact & GitHub Bar -->
    <g transform="translate(0, 222)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      <text x="0" y="0">
        <tspan fill="#a855f7" font-weight="700">github.com/amitbuilds18</tspan>
        <tspan fill="#475569">  •  </tspan>
        <tspan fill="#06b6d4" font-weight="700">amitkumarpatel7562@gmail.com</tspan>
        <tspan fill="#475569">  •  </tspan>
        <tspan fill="#94a3b8">B.Tech CSE (Sagar Group - SISTec)</tspan>
      </text>
    </g>
  </g>
</svg>
